name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: build
        env:
          GOARCH: amd64
          GOOS: linux
          CGO_ENABLED: 0
        run: |
          VERSION="$(git describe --tags --always --dirty)"
          go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o shelf .

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: shelf
